<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fútbol 11 · Control de partido</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f5f7f4,#101512);--panel:light-dark(#fff,#171d19);--panel2:light-dark(#eef2ee,#202721);--text:light-dark(#172019,#edf4ee);--muted:light-dark(#657067,#aeb9b0);--border:light-dark(#d7ded8,#303a32);--accent:#198754;--accent2:#dff5e8;--danger:#c63b3b;--warn:#d59a17;--pitch:#277a4a;--pitch2:#338d59}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}#app{min-height:100vh;background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:1250px;margin:auto;padding:18px}.top{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:16px}.brand h1{font-size:24px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}.score{display:flex;align-items:center;gap:14px}.scorebox{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:9px 16px;text-align:center}.scorebox strong{font-size:27px}.timer{font-variant-numeric:tabular-nums;letter-spacing:1px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;background:var(--panel);border:1px solid var(--border);padding:10px;border-radius:14px;margin-bottom:16px}.btn{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 13px;font-weight:650}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.btn.danger{color:white;background:var(--danger);border-color:var(--danger)}.btn.warn{background:#f3d78e;color:#3b2c08;border-color:#d7ad4c}.btn:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(330px,.9fr);gap:16px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px}.panel h2{font-size:17px;margin:0 0 12px}.pitch{position:relative;aspect-ratio:1.55;border-radius:14px;overflow:hidden;background:var(--pitch);border:3px solid rgba(255,255,255,.65);min-height:520px}.pitch:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.035) 0 12.5%,transparent 12.5% 25%,rgba(255,255,255,.035) 25% 37.5%,transparent 37.5% 50%,rgba(255,255,255,.035) 50% 62.5%,transparent 62.5% 75%,rgba(255,255,255,.035) 75% 87.5%,transparent 87.5%);}.line{position:absolute;border:2px solid rgba(255,255,255,.65);pointer-events:none}.mid{left:50%;top:0;bottom:0;border-left:2px solid rgba(255,255,255,.65)}.circle{width:24%;aspect-ratio:1;left:38%;top:38%;border-radius:50%}.boxL,.boxR{top:28%;height:44%;width:15%}.boxL{left:0}.boxR{right:0}.goalL,.goalR{top:40%;height:20%;width:3%;background:rgba(255,255,255,.16)}.goalL{left:-3%}.goalR{right:-3%}.pos{position:absolute;transform:translate(-50%,-50%);width:128px;text-align:center}.dot{width:50px;height:50px;margin:auto;border-radius:50%;background:#fff;color:#15331f;border:3px solid #163e26;display:grid;place-items:center;font-weight:800;box-shadow:0 4px 12px #0004}.pos .pname{margin-top:5px;background:#0c2416d9;color:white;border-radius:8px;padding:4px 6px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pos.empty .dot{background:#ffffff40;color:white;border-color:#fff8}.pos.empty .pname{background:#0005}.bench{display:grid;gap:8px;margin-top:12px}.player{display:grid;grid-template-columns:36px 1fr auto auto;gap:8px;align-items:center;border:1px solid var(--border);border-radius:11px;padding:8px 9px;background:var(--panel2)}.num{font-weight:800;color:var(--accent)}.small{font-size:12px;color:var(--muted)}.player .name{font-weight:700}.pill{font-size:11px;border:1px solid var(--border);border-radius:999px;padding:3px 7px}.in{color:#137844}.out{color:var(--muted)}.sidegrid{display:grid;gap:16px}.formrow{display:grid;grid-template-columns:1fr 90px 100px;gap:7px}.input,.select{width:100%;padding:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:9px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:8px 6px;border-bottom:1px solid var(--border);text-align:left}.table th:last-child,.table td:last-child{text-align:right}.event{display:flex;gap:9px;align-items:center;border-bottom:1px solid var(--border);padding:8px 0;font-size:13px}.event:last-child{border-bottom:0}.goalicon{font-size:19px}.emptymsg{color:var(--muted);font-size:13px;padding:10px 0}.tabs{display:flex;gap:7px;margin-bottom:12px}.tab.active{background:var(--accent);color:white;border-color:var(--accent)}.note{font-size:12px;color:var(--muted);margin-top:8px}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:18px;z-index:20}.modal.show{display:grid}.modalbox{max-width:500px;width:100%;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px}.modalbox h3{margin:0 0 12px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:360px;overflow:auto}.choice{text-align:left}.choice.selected{outline:3px solid var(--accent)}
@media(max-width:850px){.grid{grid-template-columns:1fr}.pitch{min-height:450px}.pos{width:92px}.dot{width:43px;height:43px}.pos .pname{font-size:10px}.top{align-items:flex-start}.scorebox{padding:7px 11px}.scorebox strong{font-size:22px}}
@media(max-width:560px){.wrap{padding:10px}.top{display:block}.score{margin-top:10px}.formrow{grid-template-columns:1fr 75px}.formrow .role{grid-column:1/-1}.player{grid-template-columns:30px 1fr auto}.player .pill{display:none}.pitch{min-height:400px}.pos{width:76px}.dot{width:38px;height:38px;font-size:11px}.pos .pname{max-width:76px}.toolbar .btn{flex:1}.table{font-size:12px}}
</style>
</head>
<body><main id="app"><div class="wrap">
<header class="top"><div class="brand"><h1>⚽ Fútbol 11 · Control de partido</h1><p>18 jugadores · posiciones · cambios · minutos · goles · pausas</p></div><div class="score"><div class="scorebox"><div class="small">TIEMPO</div><strong class="timer" id="clock">00:00</strong></div><div class="scorebox"><div class="small">MARCADOR</div><strong id="score">0 - 0</strong></div></div></header>
<section class="toolbar"><button class="btn primary" id="start">▶ Iniciar</button><button class="btn" id="pause">⏸ Pausa</button><button class="btn warn" id="half">⏸ Media parte</button><button class="btn warn" id="hydration">💧 Hidratación</button><button class="btn" id="resume">▶ Reanudar</button><button class="btn danger" id="new">↺ Nuevo partido</button></section>
<div class="grid"><section class="panel"><h2>Once en el campo</h2><div class="pitch" id="pitch"><div class="line mid"></div><div class="line circle"></div><div class="line boxL"></div><div class="line boxR"></div><div class="line goalL"></div><div class="line goalR"></div></div><div class="bench"><h2 style="margin-top:4px">Banquillo</h2><div id="bench"></div></div></section>
<div class="sidegrid">
<section class="panel"><h2>Plantilla <span class="small">(<span id="count">0</span>/18)</span></h2><div class="formrow"><input class="input" id="pname" placeholder="Nombre jugador"><input class="input" id="number" type="number" min="1" max="99" placeholder="Dorsal"><select class="select role" id="role"><option>POR</option><option>LD</option><option>DFC</option><option>LI</option><option>MCD</option><option>MC</option><option>ED</option><option>EI</option><option>MCO</option><option>DC</option></select></div><button class="btn primary" id="add" style="margin-top:8px;width:100%">+ Añadir jugador</button><div id="players" style="margin-top:10px"></div></section>
<section class="panel"><h2>⚽ Goles</h2><button class="btn primary" id="goal" style="width:100%">+ Registrar gol</button><div id="events" style="margin-top:8px"></div></section>
<section class="panel"><h2>📊 Estadísticas</h2><div class="tabs"><button class="btn tab active" data-tab="minutes">Minutos</button><button class="btn tab" data-tab="goals">Goles</button></div><div id="stats"></div></section>
</div></div></div></main>
<div class="modal" id="modal"><div class="modalbox"><h3 id="modalTitle"></h3><div id="modalBody"></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn" id="closeModal">Cancelar</button><button class="btn primary" id="modalOk">Confirmar</button></div></div></div>
<script>
(()=>{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const pos={POR:[9,50],LD:[24,18],DFC:[24,39],DFC2:[24,61],LI:[24,82],MCD:[43,50],MC:[53,35],MC2:[53,65],ED:[68,20],EI:[68,80],MCO:[68,50],DC:[86,50]};
let players=[],events=[],running=false,match=0,last=Date.now(),period=1,selectedTab='minutes',modalAction=null, modalSelected=null;
function timeFmt(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function nowTotal(p){return p.minutes+(p.on&&running?(Date.now()-p.last)/1000:0)}
function render(){
 $('#clock').textContent=timeFmt(match); $('#score').textContent=players.reduce((a,p)=>a+p.goals,0)+' - 0'; $('#count').textContent=players.length;
 const active=players.filter(p=>p.on); const roleMap={}; active.forEach(p=>{if(!roleMap[p.role])roleMap[p.role]=p});
 $('#pitch').querySelectorAll('.pos').forEach(x=>x.remove());
 const slots=[['POR',9,50],['LD',24,18],['DFC',24,39],['DFC2',24,61],['LI',24,82],['MCD',43,50],['MC',53,35],['MC2',53,65],['ED',68,20],['EI',68,80],['MCO',68,50],['DC',86,50]];
 slots.forEach(([r,x,y])=>{let p=roleMap[r]||null;if(!p && (r==='DFC2'))p=active.find(q=>q.role==='DFC'&&q!==roleMap.DFC);if(!p&&r==='MC2')p=active.find(q=>q.role==='MC'&&q!==roleMap.MC);let el=document.createElement('div');el.className='pos '+(!p?'empty':'');el.style.left=y+'%';el.style.top=x+'%';el.innerHTML='<div class="dot">'+(p?(p.number||'•'):'—')+'</div><div class="pname">'+(p?p.name:r.replace('2',''))+'</div>';$('#pitch').appendChild(el)});
 $('#bench').innerHTML=players.filter(p=>!p.on).map(p=>playerRow(p,true)).join('')||'<div class="emptymsg">Todos los jugadores están en el campo.</div>';
 $('#players').innerHTML=players.map(p=>playerRow(p,false)).join('')||'<div class="emptymsg">Añade los 18 jugadores de la plantilla.</div>';
 bindPlayerButtons(); renderEvents(); renderStats();
}
function playerRow(p,bench){return '<div class="player"><div class="num">'+(p.number||'—')+'</div><div><div class="name">'+esc(p.name)+'</div><div class="small">'+p.role+' · '+timeFmt(nowTotal(p))+'</div></div><span class="pill '+(p.on?'in':'out')+'">'+(p.on?'EN CAMPO':'BANQUILLO')+'</span><button class="btn" data-act="toggle" data-id="'+p.id+'">'+(p.on?'Sale':'Entra')+'</button></div>'}
function bindPlayerButtons(){$$('.btn[data-act="toggle"]').forEach(b=>b.onclick=()=>togglePlayer(b.dataset.id))}
function togglePlayer(id){if(!running)return alert('Primero pulsa Iniciar o Reanudar.');let p=players.find(x=>x.id===id);if(!p)return;if(p.on){p.minutes+=(Date.now()-p.last)/1000;p.on=false;events.push({type:'change',player:p.name,minute:match})}else{p.on=true;p.last=Date.now();events.push({type:'change',player:p.name,minute:match})}render()}
function renderEvents(){$('#events').innerHTML=events.slice().reverse().map(e=>e.type==='goal'?'<div class="event"><span class="goalicon">⚽</span><div><b>'+esc(e.player)+'</b> · gol<br><span class="small">min '+Math.floor(e.minute/60)+':'+String(Math.floor(e.minute%60)).padStart(2,'0')+'</span></div></div>': '<div class="event">🔄 <div><b>'+esc(e.player)+'</b> · '+(players.find(p=>p.name===e.player)?.on?'entra':'sale')+'<br><span class="small">'+timeFmt(e.minute)+'</span></div></div>').join('')||'<div class="emptymsg">Todavía no hay eventos.</div>'}
function renderStats(){let arr=players.map(p=>({p,t:nowTotal(p)})).sort((a,b)=>selectedTab==='minutes'?b.t-a.t:b.p.goals-a.p.goals);$('#stats').innerHTML=arr.length?'<table class="table"><thead><tr><th>Dorsal</th><th>Jugador</th><th>'+ (selectedTab==='minutes'?'Minutos':'Goles') +'</th></tr></thead><tbody>'+arr.map(x=>'<tr><td>'+esc(String(x.p.number||'—'))+'</td><td>'+esc(x.p.name)+'</td><td><b>'+(selectedTab==='minutes'?timeFmt(x.t):x.p.goals)+'</b></td></tr>').join('')+'</tbody></table>':'<div class="emptymsg">Sin jugadores.</div>'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openModal(title,body,action){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').classList.add('show');modalAction=action;modalSelected=null;$$('#modalBody .choice').forEach(c=>c.onclick=()=>{$$('#modalBody .choice').forEach(x=>x.classList.remove('selected'));c.classList.add('selected');modalSelected=c.dataset.id})}
$('#closeModal').onclick=()=>$('#modal').classList.remove('show');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')};
$('#modalOk').onclick=()=>{if(modalAction)modalAction(modalSelected);$('#modal').classList.remove('show')};
$('#add').onclick=()=>{if(players.length>=18)return alert('La plantilla ya tiene 18 jugadores.');let name=$('#pname').value.trim();if(!name)return;let number=$('#number').value.trim();let role=$('#role').value;players.push({id:crypto.randomUUID(),name,number,role,minutes:0,on:false,last:0,goals:0});$('#pname').value='';$('#number').value='';render()};
$('#pname').addEventListener('keydown',e=>{if(e.key==='Enter')$('#add').click()});
$('#start').onclick=()=>{if(!running){running=true;last=Date.now();players.forEach(p=>{if(p.on)p.last=Date.now()});render()}};
$('#resume').onclick=()=>$('#start').click();
$('#pause').onclick=()=>pause('Pausa');
$('#half').onclick=()=>pause('Media parte');
$('#hydration').onclick=()=>pause('Pausa de hidratación');
function pause(kind){if(!running)return;let n=Date.now();match+=(n-last)/1000;players.forEach(p=>{if(p.on){p.minutes+=(n-p.last)/1000;p.last=n}});running=false;events.push({type:'pause',player:kind,minute:match});render()}
$('#new').onclick=()=>{if(confirm('¿Empezar un nuevo partido? Se borrarán minutos, goles y eventos.')){running=false;match=0;period=1;events=[];players.forEach(p=>{p.minutes=0;p.on=false;p.last=0;p.goals=0});render()}};
$('#goal').onclick=()=>{if(!players.length)return;openModal('¿Quién ha marcado?','<div class="choices">'+players.map(p=>'<button type="button" class="btn choice" data-id="'+p.id+'">'+esc(p.number||'—')+' · '+esc(p.name)+'</button>').join('')+'</div>',id=>{let p=players.find(x=>x.id===id);if(p){p.goals++;events.push({type:'goal',player:p.name,minute:match});render()}})};
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedTab=b.dataset.tab;renderStats()});
setInterval(()=>{if(running){let n=Date.now();match+=(n-last)/1000;last=n;render()}},1000);render();
})();
</script></body></html>
